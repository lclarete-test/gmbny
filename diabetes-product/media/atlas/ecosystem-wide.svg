<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="680" viewBox="0 0 1200 680" role="img" aria-labelledby="t d" font-family="Arial,Helvetica,sans-serif"><title id="t">The U.S. diabetes care ecosystem</title><desc id="d">40.1 million U.S. people living with diagnosed or undiagnosed diabetes in 2023. About 2.4 million U.S. family caregivers of adults named diabetes as the main reason for care in the 2025 report. 8,706 U.S. physicians held active board certification in endocrinology, diabetes and metabolism in June 2026. The American Diabetes Association reported more than 3,700 recognized diabetes education sites nationwide in 2025. Public messages and peer accounts reach households. By March 2026, one national prediabetes campaign had recorded over 33.7 million risk-test completions. Medicare paid 41% and private insurers 32% of annual diabetes treatment spending in the 2021–22 MEPS survey. The FDA issued 96 marketing authorizations in the selected connected glucose-monitoring, pump and dosing-controller families from January 2018 through October 2026. Drug and device makers supply medicines, insulin delivery systems and glucose monitors. Dexcom alone reported $2.89 billion in U.S. revenue in 2024. Pharmacies dispense prescriptions and suppliers provide equipment. In 2021–22, 95.9% of U.S. community-dwelling adults treated for diabetes used outpatient prescribed medicines for diabetes.</desc><defs><marker id="arrow-community" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M1 1l5 2-5 2" fill="none" stroke="#9a86b7" stroke-width="1.4"/></marker><marker id="arrow-care" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M1 1l5 2-5 2" fill="none" stroke="#7698b1" stroke-width="1.4"/></marker><marker id="arrow-supply" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M1 1l5 2-5 2" fill="none" stroke="#bb936f" stroke-width="1.4"/></marker></defs><rect width="100%" height="100%" fill="#fff"/><path d="M563 48 H202" fill="none" stroke="#9a86b7" stroke-width="1.8" marker-end="url(#arrow-community)"/><text x="385" y="42" font-size="14" font-weight="550" fill="#65508d" text-anchor="middle" letter-spacing="0" paint-order="stroke" stroke="white" stroke-width="7" stroke-linejoin="round">campaigns</text><path d="M638 48 H996" fill="none" stroke="#7698b1" stroke-width="1.8" marker-end="url(#arrow-care)" marker-start="url(#arrow-care)"/><text x="818" y="42" font-size="14" font-weight="550" fill="#335f84" text-anchor="middle" letter-spacing="0" paint-order="stroke" stroke="white" stroke-width="7" stroke-linejoin="round">training &amp; referrals</text><path d="M160 179 V239" fill="none" stroke="#9a86b7" stroke-width="1.8" marker-end="url(#arrow-community)"/><text x="208" y="216" font-size="14" font-weight="550" fill="#65508d" text-anchor="middle" letter-spacing="0" paint-order="stroke" stroke="white" stroke-width="7" stroke-linejoin="round">peer stories</text><path d="M600 178 V222" fill="none" stroke="#9a86b7" stroke-width="1.8" marker-end="url(#arrow-community)"/><text x="647" y="204" font-size="14" font-weight="550" fill="#65508d" text-anchor="middle" letter-spacing="0" paint-order="stroke" stroke="white" stroke-width="7" stroke-linejoin="round">education</text><path d="M930 167 Q817 184 683 259" fill="none" stroke="#7698b1" stroke-width="1.8" marker-end="url(#arrow-care)"/><text x="819" y="201" font-size="14" font-weight="550" fill="#335f84" text-anchor="middle" letter-spacing="0" paint-order="stroke" stroke="white" stroke-width="7" stroke-linejoin="round">diagnose &amp; treat</text><path d="M210 271 Q365 268 501 305" fill="none" stroke="#9a86b7" stroke-width="1.8" marker-end="url(#arrow-community)"/><text x="368" y="274" font-size="14" font-weight="550" fill="#65508d" text-anchor="middle" letter-spacing="0" paint-order="stroke" stroke="white" stroke-width="7" stroke-linejoin="round">help at home</text><path d="M986 271 Q827 268 699 305" fill="none" stroke="#7698b1" stroke-width="1.8" marker-end="url(#arrow-care)"/><text x="827" y="274" font-size="14" font-weight="550" fill="#335f84" text-anchor="middle" letter-spacing="0" paint-order="stroke" stroke="white" stroke-width="7" stroke-linejoin="round">cover treatment</text><path d="M1037 409 V485" fill="none" stroke="#7698b1" stroke-width="1.8" marker-end="url(#arrow-care)"/><text x="1081" y="455" font-size="14" font-weight="550" fill="#335f84" text-anchor="middle" letter-spacing="0" paint-order="stroke" stroke="white" stroke-width="7" stroke-linejoin="round">pay claims</text><path d="M944 488 Q815 458 679 394" fill="none" stroke="#bb936f" stroke-width="1.8" marker-end="url(#arrow-supply)"/><text x="812" y="443" font-size="14" font-weight="550" fill="#925827" text-anchor="middle" letter-spacing="0" paint-order="stroke" stroke="white" stroke-width="7" stroke-linejoin="round">dispense &amp; deliver</text><path d="M197 520 H560" fill="none" stroke="#bb936f" stroke-width="1.8" marker-end="url(#arrow-supply)"/><text x="381" y="514" font-size="14" font-weight="550" fill="#925827" text-anchor="middle" letter-spacing="0" paint-order="stroke" stroke="white" stroke-width="7" stroke-linejoin="round">review devices</text><path d="M638 520 H998" fill="none" stroke="#bb936f" stroke-width="1.8" marker-end="url(#arrow-supply)"/><text x="816" y="514" font-size="14" font-weight="550" fill="#925827" text-anchor="middle" letter-spacing="0" paint-order="stroke" stroke="white" stroke-width="7" stroke-linejoin="round">supply</text><g transform="translate(161 269)"><circle r="27" fill="#f1ebf7" stroke="#65508d" stroke-opacity=".25"/><g transform="scale(1.2272727272727273)" fill="none" stroke="#65508d" stroke-width="1.65" stroke-linecap="round" stroke-linejoin="round"><path d="M-15 5l7-6c2-1 4 2 3 3l-3 3h8l7-5c3-2 5 1 3 3L3 12H-7l-5 2m6-18c-7-5-5-12-1-12 3 0 4 2 4 3 1-2 2-3