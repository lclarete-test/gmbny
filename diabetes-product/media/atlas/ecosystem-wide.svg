 font-weight="670" fill="#65508d" text-anchor="middle" letter-spacing="-.8" >3,700+</text><text x="600" y="156" font-size="16" font-weight="450" fill="#4d5870" text-anchor="middle" letter-spacing="0" >ADA-recognized education sites</text><text x="600" y="177" font-size="16" font-weight="450" fill="#4d5870" text-anchor="middle" letter-spacing="0" >2025 annual report</text><g transform="translate(161 48)"><circle r="27" fill="#f1ebf7" stroke="#65508d" stroke-opacity=".25"/><g transform="scale(1.2272727272727273)" fill="none" stroke="#65508d" stroke-width="1.65" stroke-linecap="round" stroke-linejoin="round"><path d="M-12-5h6l12-6V8L-6 3h-6zm6 9l2 7h-5l-2-7m20-7 5-3m-5 7h5"/></g></g><text x="161" y="99" font-size="22" font-weight="640" fill="#252940" text-anchor="middle" letter-spacing="-.4" >Media &amp; peer voices</text><text x="161" y="132" font-size="31" font-weight="670" fill="#65508d" text-anchor="middle" letter-spacing="-.8" >33.7M+</text><text x="161" y="156" font-size="16" font-weight="450" fill="#4d5870" text-anchor="middle" letter-spacing="0" >Campaign risk tests completed</text><text x="161" y="177" font-size="16" font-weight="450" fill="#4d5870" text-anchor="middle" letter-spacing="0" >by March 2026</text><g transform="translate(1036 269)"><circle r="27" fill="#eaf2f8" stroke="#335f84" stroke-opacity=".25"/><g transform="scale(1.2272727272727273)" fill="none" stroke="#335f84" stroke-width="1.65" stroke-linecap="round" stroke-linejoin="round"><path d="M0-13l12 4v9c0 7-6 11-12 14C-6 11-12 7-12 0v-9zM-5 0l4 4 7-8"/></g></g><text x="1036" y="320" font-size="22" font-weight="640" fill="#252940" text-anchor="middle" letter-spacing="-.4" >Public &amp; private payers</text><text x="1036" y="353" font-size="31" font-weight="670" fill="#335f84" text-anchor="middle" letter-spacing="-.8" >41% / 32%</text><text x="1036" y="377" font-size="16" font-weight="450" fill="#4d5870" text-anchor="middle" letter-spacing="0" >Medicare / private share of diabetes</text><text x="10