<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 356 636" width="356" height="636" role="img" aria-labelledby="fig-title fig-desc">
<title id="fig-title">Where people can turn for diabetes support</title>
<desc id="fig-desc">Five selected organizations connect different needs with services: the American Diabetes Association for school rights, Beyond Type 1 for insulin affordability, Breakthrough T1D for clinical trials, ADCES for local diabetes education and the diaTribe Foundation for treatment and device information. The ADA reported more than 3,700 recognized diabetes education sites serving about 800,000 people annually.</desc>
