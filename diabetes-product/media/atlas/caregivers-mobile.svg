<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 356 553" width="356" height="553" role="img" aria-labelledby="fig-title fig-desc">
<title id="fig-title">People with diabetes and the people caring for them</title>
<desc id="fig-desc">In 2023, 40.1 million U.S. people lived with diabetes. In the 2025 national caregiving report, 4% of U.S. family caregivers of adults, about 2.4 million people, cited diabetes as the main reason for care. In a separate 2025 survey of caregivers in 31 states, 60.7% were female, 79.1% helped with household tasks, 34.2% helped with nursing or medical tasks, 33.3% had given care for at least five years, and 21.6% reported poor mental health on at least 14 of the past 30 days.</desc>
