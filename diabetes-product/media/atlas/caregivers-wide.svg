<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 986 384" width="986" height="384" role="img" aria-labelledby="fig-title fig-desc">
<title id="fig-title">People with diabetes and the people caring for them</title>
<desc id="fig-desc">40.1 million U.S. people had diabetes in 2023. About 2.4 million family caregivers in the 2025 national report supported an adult mainly because of diabetes. In the 2025 caregiver module in 31 states, 60.7% were female, 79.1% did household tasks and 34.2% gave nursing or medical help.</desc>
<defs><style>text{font-family:Arial,'Liberation Sans',sans-serif;font-variant-numeric:tabular-nums}</style></defs>
<rect width="986" height="384" fill="#ffffff"/>
