<text x="822" y="136" font-size="24" font-weight="700" fill="#242641" text-anchor="start">60.7%</text>
<text x="783" y="165" font-size="15" font-weight="450" fill="#515a72" text-anchor="start">were female</text>
<circle cx="795" cy="204" r="16" fill="#eaf2f8" stroke="#365e82" stroke-width="1.4"/>
<g transform="translate(785.72 194.72) scale(0.5800)" color="#365e82" stroke="#365e82" fill="none" stroke-width="1.65" stroke-linecap="round" stroke-linejoin="round"><path d="M2.5 15 16 4l13.5 11M6 13v15h20V13M13 28v-9h6v9"/></g>
<text x="822" y="208" font-size="24" font-weight="700" fill="#242641" text-anchor="start">79.1%</text>
<text x="783" y="237" font-size="15" font-weight="450" fill="#515a72" text-anchor="start">gave household help</text>
