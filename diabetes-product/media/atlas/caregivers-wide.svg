<circle cx="196" cy="183" r="85" fill="#ffffff" stroke="#9e8cc3" stroke-width="1.8"/>
<g transform="translate(180 141) scale(1.0000)" color="#58469c" stroke="#58469c" fill="none" stroke-width="1.65" stroke-linecap="round" stroke-linejoin="round"><circle cx="16" cy="9" r="4.7"/><path d="M6 28v-3a10 10 0 0 1 20 0v3"/></g>
<text x="196" y="205" font-size="34" font-weight="700" fill="#242641" text-anchor="middle">40.1M</text>
<text x="196" y="228" font-size="16" font-weight="550" fill="#515a72" text-anchor="middle">with diabetes¹</text>
<text x="196" y="82" font-size="17" font-weight="620" fill="#58469c" text-anchor="middle">Family care</text>
<circle cx="326" cy="126" r="3.4" fill="#58469c" stroke="none" stroke-width="1"/>
<path d="M326 126 H369 Q378 126 386 118 L401 103 H424" fill="none" stroke="#58469c" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
