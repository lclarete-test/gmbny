<text x="437" y="145" font-size="17" font-weight="400" fill="#242641" text-anchor="start">recipient needed help chiefly</text>
<text x="437" y="169" font-size="17" font-weight="400" fill="#242641" text-anchor="start">because of diabetes.²</text>
<path d="M751 70 L751 306" fill="none" stroke="#dcdde6" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/>
<text x="783" y="91" font-size="16" font-weight="600" fill="#515a72" text-anchor="start">Caregivers in 31 states</text>
