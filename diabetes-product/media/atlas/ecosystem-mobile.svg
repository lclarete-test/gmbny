<svg xmlns="http://www.w3.org/2000/svg" width="390" height="713" viewBox="0 0 390 713" role="img" aria-labelledby="t d" font-family="Arial,Helvetica,sans-serif"><title id="t">The U.S. diabetes care ecosystem</title><desc id="d">40.1 million U.S. people living with diagnosed or undiagnosed diabetes in 2023. About 2.4 million U.S. family caregivers of adults named diabetes as the main reason for care in the 2025 report. 8,706 U.S. physicians held active board certification in endocrinology, diabetes and metabolism in June 2026. 416 U.S. 501(c)(3) nonprofits had names identifying them with human diabetes in the November 2026 IRS registry. Public messages and peer accounts reach households. By March 2026, one national prediabetes campaign had recorded over 33.7 million risk-test completions. Medicare paid 41% and private insurers 32% of annual diabetes treatment spending in the 2021–22 MEPS survey. The FDA issued 96 marketing authorizations in the selected connected glucose-monitoring, pump and dosing-controller families from January 2018 through October 2026. Drug and device makers supply medicines, insulin delivery systems and glucose monitors. Dexcom alone reported $2.89 billion in U.S. revenue in 2024. Pharmacies dispense prescriptions and suppliers provide equipment. In 2021–22, 95.9% of U.S. community-dwelling adults treated for diabetes used outpatient prescribed medicines for diabetes.</desc><defs><marker id="arrow-community" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M1 1l5 2-5 2" fill="none" stroke="#9a86b7" stroke-width="1.4"/></marker><marker id="arrow-care" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M1 1l5 2-5 2" fill="none" stroke="#7698b1" stroke-width="1.4"/></marker><marker id="arrow-supply" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M1 1l5 2-5 2" fill="none" stroke="#bb936f" stroke-width="1.4"/></marker></defs><rect width="100%" height="100%" fill="#fff"/><rect x="17" y="12" width="356" height="99" rx="20" fill="#50416f"/><g transform="translate(61 63)"><circle r="23" fill="#6b5a86" stroke="#fff" stroke-opacity=".25"/><g transform="scale(1.0454545454545454)" fill="none" stroke="#fff" stroke-width="1.65" stroke-linecap="round" stroke-linejoin="round"><path d="M-15 2h7l3-9 6 15 4-9h10"/></g></g><text x="99" y="58" font-size="39" font-weight="690" fill="#fff" text-anchor="start" letter-spacing="-1.5" >40.1M</text><text x="100" y="82" font-size="13.6" font-weight="450" fill="#fff" text-anchor="start" letter-spacing="0" >people living with diabetes · U.S. 2023</text><path d="M195 111v22M100 155v-16q0-6 6-6h177q6 0 6 6v16" stroke="#a79ab9" stroke-width="2" fill="none"/><text x="99" y="150" font-size="13.5" font-weight="600" fill="#65508d" text-anchor="middle" letter-spacing="0" paint-order="stroke" stroke="white" stroke-width="7" stroke-linejoin="round">Care &amp; information</text><text x="289" y="150" font-size="13.5" font-weight="600" fill="#335f84" text-anchor="middle" letter-spacing="0" paint-order="stroke" stroke="white" stroke-width="7" stroke-linejoin="round">Treatment &amp; access</text><path d="M98 160H18v295h39M289 160h82v438h-28" fill="none" stroke="#c1b7cb" stroke-width="1.5"/><path d="M18 183H80" stroke="#9a86b7" stroke-width="1.5" fill="none"/><g transform="translate(101 183)"><circle r="19" fill="#f1ebf7" stroke="#65508d" stroke-opacity=".25"/><g transform="scale(0.8636363636363636)" fill="none" stroke="#65508d" stroke-width="1.65" stroke-linecap="round" stroke-linejoin="round"><path d="M-15 5l7-6c2-1 4 2 3 3l-3 3h8l7-5c3-2 5 1 3 3L3 12H-7l-5 2m6-18c-7-5-5-12-1-12 3 0 4 2 4 3 1-2 2-3 5-3 6 1 4 8-4 13"/></g></g><text x="101" y="221" font-size="15" font-weight="650" fill="#252940" text-anchor="middle" letter-spacing="-.2" >Family caregivers</text><text x="101" y="245" font-size="22" font-weight="680" fill="#65508d" text-anchor="middle" letter-spacing="-.5" >≈2.4M</text><text x="101" y="266" font-size="13.4" font-weight="450" fill="#4d5870" text-anchor="middle" letter-spacing="0" >adult care mainly</text><text x="101" y="283" font-size="13.4" font-weight="450" fill="#4d5870" text-anchor="middle" letter-spacing="0" >for diabetes · 2025</text><path d="M371 183H310" stroke="#7698b1" stroke-width="1.5" fill="none"/><g transform="translate(289 183)"><circle r="19" fill="#eaf2f8" stroke="#335f84" stroke-opacity=".25"/><g transform="scale(0.8636363636363636)" fill="none" stroke="#335f84" stroke-width="1.65" stroke-linecap="round" stroke-linejoin="round"><path d="M-11-12v8a6 6 0 0012 0v-8m-14 0h4m8 0h4M-5 3v5a7 7 0 0014 0V4"/><circle cx="9" cy="1" r="3"/></g></g><text x="289" y="221" font-size="13.7" font-weight="650" fill="#252940" text-anchor="middle" letter-spacing="-.2" >Clinicians &amp; educators</text><text x="289" y="245" font-size="22" font-weight="680" fill="#335f84" text-anchor="middle" letter-spacing="-.5" >8,706</text><text x="289" y="266" font-size="13.4" font-weight="450" fill="#4d5870" text-anchor="middle" letter-spacing="0" >U.S. endocrine</text><text x="289" y="283" font-size="13.4" font-weight="450" fill="#4d5870" text-anchor="middle" letter-spacing="0" >subspecialists · 2026</text><path d="M18 318H80" stroke="#9a86b7" stroke-width="1.5" fill="none"/><g transform="translate(101 318)"><circle r="19" fill="#f1ebf7" stroke="#65508d" stroke-opacity=".25"/><g transform="scale(0.8636363636363636)" fill="none" stroke="#65508d" stroke-width="1.65" stroke-linecap="round" stroke-linejoin="round"><path d="M-12 2h8v10h-8zM4 2h8v10H4zM-7 2v-5H7v5m-7-5v-4"/><circle cx="0" cy="-10" r="4"/></g></g><text x="101" y="356" font-size="15" font-weight="650" fill="#252940" text-anchor="middle" letter-spacing="-.2" >Diabetes nonprofits</text><text x="101" y="380" font-size="22" font-weight="680" fill="#65508d" text-anchor="middle" letter-spacing="-.5" >416</text>