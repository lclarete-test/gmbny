<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 356 605" width="356" height="605" role="img" aria-labelledby="fig-title fig-desc">
<title id="fig-title">From a blood test to a care routine</title>
<desc id="fig-desc">A laboratory result branches into three example care pathways. In the 2025 U.S. National Health Interview Survey, an estimated 2.3 million adults reported type 1 diabetes, 22.1 million type 2 diabetes, and 28.2 million prediabetes without diagnosed diabetes. Insulin, treatment planning and prevention lead to different follow-up needs.</desc>
<defs><style>text{font-family:Arial,'Liberation Sans',sans-serif;font-variant-numeric:tabular-nums}</style></defs>
<rect width="356" height="605" fill="#ffffff"/>
<text x="18" y="27" font-size="15" font-weight="500" fill="#515a72" text-anchor="start">From a laboratory result to daily care</text>
<text x="18" y="53" font-size="13.8" font-weight="400" fill="#515a72" text-anchor="start">U.S. adults reporting each diagnosis · 2025</text>
<path d="M38 105 L38 442" fill="none" stroke="#cdc9dd" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"/>
<circle cx="38" cy="94" r="20" fill="#f8f8fb" stroke="#242641" stroke-width="1.4"/>
<g transform="translate(26.4 82.4) scale(0.7250)" color="#242641" stroke="#242641" fill="none" stroke-width="1.65" stroke-linecap="round" stroke-linejoin="round"><path d="M8 5h10M10 6v14a4 4 0 0 0 8 0V6M11 13h6M21 6l5 5M24 2l5 5M19 14l5-6M8 26l-3 3"/></g>
<text x="70" y="91" font-size="18" font-weight="700" fill="#242641" text-anchor="start">Blood test</text>
<text x="70" y="113" font-size="15" font-weight="400" fill="#515a72" text-anchor="start">A1C or plasma glucose</text>
