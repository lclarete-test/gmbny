<text x="106" y="390" font-size="15.5" font-weight="500" fill="#242641" text-anchor="start">Review A1C</text>
<path d="M38 416 Q38 438 61 438 H73" fill="none" stroke="#8b502f" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
<circle cx="73" cy="438" r="4.5" fill="#ffffff" stroke="#8b502f" stroke-width="2.6"/>
<text x="84" y="444" font-size="18" font-weight="650" fill="#8b502f" text-anchor="start">Prediabetes only</text>
<text x="338" y="444" font-size="20" font-weight="700" fill="#242641" text-anchor="end">28.2M</text>
<path d="M83 483 L83 521" fill="none" stroke="#8b502f" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
<circle cx="83" cy="482" r="13" fill="#f8eee5" stroke="#8b502f" stroke-width="1.4"/>
<g transform="translate(75.46000000000001 474.46) scale(0.4712)" color="#8b502f" stroke="#8b502f" fill="none" stroke-width="1.65" stroke-linecap="round" stroke-linejoin="round"><path d="M3 26h8v-6h7v-7h7V6h5M18 6l5-4m0 0h-5m5 0v5"/></g>
<text x="106" y="487" font-size="15.5" font-weight="500" fill="#242641" text-anchor="start">Find a prevention program</text>
<circle cx="83" cy="521" r="13" fill="#f8eee5" stroke="#8b502f" stroke-width="1.4"/>
<g transform="translate(75.46000000000001 513.46) scale(0.4712)" color="#8b502f" stroke="#8b502f" fill="none" stroke-width="1.65" stroke-linecap="round" stroke-linejoin="round"><path d="M26 13a10 10 0 1 0-1.5 9M26 6v7h-7M15.5 9v7l4.5 2.5"/></g>
<text x="106" y="526" font-size="15.5" font-weight="500" fill="#242641" text-anchor="start">Recheck glucose</text>
<path d="M18 548 L338 548" fill="none" stroke="#dcdde6" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/>
<text x="18" y="572" font-size="13.5" font-weight="400" fill="#515a72" text-anchor="start">Lab tests establish glucose status. Other tests and</text>
<text x="18" y="591" font-size="13.5" font-weight="400" fill="#515a72" text-anchor="start">clinical history can help distinguish diabetes types.</text>
</svg>
