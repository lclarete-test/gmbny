<circle cx="73" cy="166" r="4.5" fill="#ffffff" stroke="#58469c" stroke-width="2.6"/>
<text x="84" y="172" font-size="18" font-weight="650" fill="#58469c" text-anchor="start">Type 1 diabetes</text>
<text x="338" y="172" font-size="20" font-weight="700" fill="#242641" text-anchor="end">2.3M</text>
<path d="M83 211 L83 249" fill="none" stroke="#58469c" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
<circle cx="83" cy="210" r="13" fill="#eeeafa" stroke="#58469c" stroke-width="1.4"/>
<g transform="translate(75.46000000000001 202.46) scale(0.4712)" color="#58469c" stroke="#58469c" fill="none" stroke-width="1.65" stroke-linecap="round" stroke-linejoin="round"><g transform="rotate(39 16 16)"><rect x="12" y="7" width="8" height="17" rx="2"/><path d="M13 7V4h6v3M12 11h8M14 24v3h4v-3M16 27v3M17 14h3M17 18h3"/></g></g>
<text x="106" y="215" font-size="15.5" font-weight="500" fill="#242641" text-anchor="start">Start insulin</text>
