<g transform="translate(75.46000000000001 241.46) scale(0.4712)" color="#58469c" stroke="#58469c" fill="none" stroke-width="1.65" stroke-linecap="round" stroke-linejoin="round"><rect x="7" y="2.5" width="18" height="25" rx="4"/><path d="M10.5 7h11v9h-11zM12 12h2l1.5-3 1.5 5 1.5-2h2M15 20.5h2M14 28v2h4v-2"/></g>
<text x="106" y="254" font-size="15.5" font-weight="500" fill="#242641" text-anchor="start">Review glucose</text>
<path d="M38 280 Q38 302 61 302 H73" fill="none" stroke="#365e82" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
<circle cx="73" cy="302" r="4.5" fill="#ffffff" stroke="#365e82" stroke-width="2.6"/>
<text x="84" y="308" font-size="18" font-weight="650" fill="#365e82" text-anchor="start">Type 2 diabetes</text>
<text x="338" y="308" font-size="20" font-weight="700" fill="#242641" text-anchor="end">22.1M</text>
