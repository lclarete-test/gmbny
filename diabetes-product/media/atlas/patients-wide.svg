<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 986 376" width="986" height="376" role="img" aria-labelledby="fig-title fig-desc">
<title id="fig-title">From a blood test to a care routine</title>
<desc id="fig-desc">A laboratory result branches into three example care pathways. In the 2025 U.S. National Health Interview Survey, an estimated 2.3 million adults reported type 1 diabetes, 22.1 million type 2 diabetes, and 28.2 million prediabetes without diagnosed diabetes. Insulin, treatment planning and prevention lead to different follow-up needs.</desc>
<defs><style>text{font-family:Arial,'Liberation Sans',sans-serif;font-variant-numeric:tabular-nums}</style></defs>
<rect width="986" height="376" fill="#ffffff"/>
<text x="25" y="32" font-size="17" font-weight="500" fill="#515a72" text-anchor="start">From a laboratory result to daily care</text>
<text x="960" y="32" font-size="15" font-weight="400" fill="#515a72" text-anchor="end">U.S. adults reporting each diagnosis · 2025</text>
<path d="M118 179 H145 C185 179 179 100 223 100 H912" fill="none" stroke="#58469c" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>
