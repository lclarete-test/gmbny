<g transform="translate(736.3 261.3) scale(0.5437)" color="#8b502f" stroke="#8b502f" fill="none" stroke-width="1.65" stroke-linecap="round" stroke-linejoin="round"><path d="M26 13a10 10 0 1 0-1.5 9M26 6v7h-7M15.5 9v7l4.5 2.5"/></g>
<text x="768" y="260" font-size="17" font-weight="550" fill="#242641" text-anchor="start">Recheck glucose</text>
