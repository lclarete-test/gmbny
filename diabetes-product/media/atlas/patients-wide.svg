<text x="247" y="86" font-size="21" font-weight="700" fill="#58469c" text-anchor="start">Type 1 diabetes</text>
<text x="249" y="127" font-size="18" font-weight="600" fill="#242641" text-anchor="start">2.3M adults</text>
<circle cx="494" cy="100" r="15" fill="#eeeafa" stroke="#58469c" stroke-width="1.4"/>
