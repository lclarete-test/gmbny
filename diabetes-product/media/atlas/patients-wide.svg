<text x="89" y="237" font-size="17" font-weight="650" fill="#242641" text-anchor="middle">Blood test</text>
<text x="89" y="258" font-size="14" font-weight="400" fill="#515a72" text-anchor="middle">A1C or</text>
<text x="89" y="277" font-size="14" font-weight="400" fill="#515a72" text-anchor="middle">plasma glucose</text>
<path d="M25 326 L961 326" fill="none" stroke="#dcdde6" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/>
<text x="25" y="353" font-size="15" font-weight="400" fill="#515a72" text-anchor="start">Lab tests establish glucose status. Clinical history and other tests can help distinguish diabetes types.</text>
