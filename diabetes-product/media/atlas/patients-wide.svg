<text x="249" y="212" font-size="18" font-weight="600" fill="#242641" text-anchor="start">22.1M adults</text>
<circle cx="494" cy="185" r="15" fill="#eaf2f8" stroke="#365e82" stroke-width="1.4"/>
<g transform="translate(485.3 176.3) scale(0.5437)" color="#365e82" stroke="#365e82" fill="none" stroke-width="1.65" stroke-linecap="round" stroke-linejoin="round"><path d="M10 5H7a1 1 0 0 0-1 1v23h19V6a1 1 0 0 0-1-1h-3"/><rect x="11" y="3" width="9" height="5" rx="1.7"/><path d="M10 13l1.5 1.5L14 11m2.5 2H22M10 20l1.5 1.5L14 18m2.5 2H22"/></g>
