<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 986 449" width="986" height="449" role="img" aria-labelledby="fig-title fig-desc">
<title id="fig-title">Who takes part in diabetes care</title>
<desc id="fig-desc">Among adults age 65 and older in a U.S. traditional Medicare cohort in 2018–2021, an annual primary care encounter was recorded for 75.2% of those with type 1 and 73.7% with type 2. Endocrinology reached 60.3% and 9.5%, respectively. Diabetes educators, dietitians, pharmacists, and eye, foot and kidney specialists also have distinct roles.</desc>
